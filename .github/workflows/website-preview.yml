name: Verify public Warder website and capture browser previews
on:
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/portal.css'
      - 'docs/portal.js'
      - 'docs/portal-art/**'
      - 'tools/verify_website_portal_browser.py'
      - '.github/workflows/website-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser testing library (runner only)
        run: python -m pip install 'playwright==1.51.0'
      - name: Verify local website structure
        run: python -m unittest discover -s tests -p 'test_website_portal.py' -v
      - name: Verify rendered website in desktop, tablet and mobile layouts
        run: python tools/verify_website_portal_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warder-website-browser-previews
          path: website-preview/
          retention-days: 14
          if-no-files-found: warn
